name: template

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run ./scripts/setup-secrets.ps1 to create .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./scripts/setup-secrets.ps1 to create .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DASHBOARD__FRONTEND__BROWSERTOKEN: ${DASHBOARD_BROWSER_TOKEN:?Run ./scripts/setup-secrets.ps1 to create .env}
    ports:
      - "127.0.0.1:18888:18888"  # dashboard UI
      - "127.0.0.1:4317:18889"   # OTLP gRPC receiver

  api:
    image: template-api:latest
    build:
      context: .
      dockerfile: src/Template.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/template-api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD:?Run ./scripts/setup-secrets.ps1 to create .env}
      ConnectionStrings__Database: Server=sqlserver,1433;Database=TemplateDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./.certs:/https:ro

volumes:
  sqlserver-data:
